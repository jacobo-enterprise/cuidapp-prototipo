<head>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Cuidapp · Enfermeras y TENS a domicilio</title>

<link rel="icon" href="logo/favicon-nm.svg">
<link rel="apple-touch-icon" href="logo/apple-touch-icon.png">
</head>
<body class="plat">
<div id="tb" class="tb"></div>
<div id="stage" class="stage"><div class="plat-load"><img src="logo/cuidapp-horizontal-nm.svg" alt="Cuidapp"></div></div>
<script>
/* Carga los mismos estilos y scripts del prototipo (index.html de la raíz), en orden,
   y luego la capa de plataforma web. Así la web siempre queda al día con el prototipo. */
(function () {
  var PV = '20261026p2';
  function css(h) { var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = h; document.head.appendChild(l); }
  function js(list, done) {
    if (!list.length) return done();
    var s = document.createElement('script'); s.src = list[0]; s.async = false;
    s.onload = function () { js(list.slice(1), done); };
    s.onerror = function () { console.error('no cargó', list[0]); js(list.slice(1), done); };
    document.body.appendChild(s);
  }
  fetch('index.html?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (t) {
    var d = new DOMParser().parseFromString(t, 'text/html');
    d.querySelectorAll('link[rel=stylesheet]').forEach(function (l) { css(l.getAttribute('href')); });
    css('plataforma/plat.css?v=' + PV);
    var srcs = [].map.call(d.querySelectorAll('script[src]'), function (s) { return s.getAttribute('src'); });
    js(srcs.concat(['plataforma/plat.js?v=' + PV]), function () { window.__platReady = true; });
  });
})();
</script>
</body>
</html>
